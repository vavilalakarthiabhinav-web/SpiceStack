<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

</head>
<body class="bg-[#FAF8F5] text-stone-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==================== SEED DATA ====================
    const TABLES_SEED = [
      { id: 'T1', name: 'Table 1', capacity: 2, zone: 'Window' },
      { id: 'T2', name: 'Table 2', capacity: 2, zone: 'Patio' },

    const TIME_SLOTS = [

      { id: '19:30', label: '7:30 PM - 9:00 PM', startMins: 19 * 60 + 30 },

    // 25 Indian & Continental Menu Items
    const MENU_SEED = [

      { id: 'M01', name: 'Paneer Tikka Angara', category: 'Starters', dietary: 'Veg', spicy: true, prepTime: 14, price: 320, emoji: '🧀', desc: 'Char-grilled cottage cheese with Kashmiri chili marinade.' },

      { id: 'M10', name: 'Laal Maas Lamb Curry', category: 'Indian Mains', dietary: 'Non-Veg', spicy: true, prepTime: 25, price: 580, emoji: '🌶️', desc: 'Rajasthani fiery Mathania chili slow-braised lamb.' },
      { id: 'M11', name: 'Palak Paneer Royale', category: 'Indian Mains', dietary: 'Veg', spicy: false, prepTime: 14, price: 380, emoji: '🥘', desc: 'Silky tempered spinach puree with soft paneer cubes.' },
      { id: 'M12', name: 'Malabar Prawn Curry', category: 'Indian Mains', dietary: 'Non-Veg', spicy: true, prepTime: 18, price: 540, emoji: '🥥', desc: 'Coastal coconut milk curry with curry leaves and kokum.' },
      { id: 'M13', name: 'Subz Dum Biryani', category: 'Indian Mains', dietary: 'Veg', spicy: true, prepTime: 20, price: 390, emoji: '🍚', desc: 'Aromatic vegetable dum biryani served with burani raita.' },
      // Continental (5)
      { id: 'M14', name: 'Herb Crusted Salmon', category: 'Continental', dietary: 'Non-Veg', spicy: false, prepTime: 22, price: 690, emoji: '🐟', desc: 'Atlantic salmon fillet with lemon caper velouté and mash.' },
      { id: 'M15', name: 'Wild Mushroom Risotto', category: 'Continental', dietary: 'Veg', spicy: false, prepTime: 20, price: 490, emoji: '🍝', desc: 'Arborio rice simmered with porcini stock and aged parmesan.' },
      { id: 'M16', name: 'Grilled Peri-Peri Chicken', category: 'Continental', dietary: 'Non-Veg', spicy: true, prepTime: 18, price: 520, emoji: '🍗', desc: 'Flame-grilled half chicken with roasted root vegetables.' },
      { id: 'M17', name: 'Penne Arrabbiata', category: 'Continental', dietary: 'Veg', spicy: true, prepTime: 14, price: 390, emoji: '🍅', desc: 'Al dente penne in spicy San Marzano garlic tomato sauce.' },
      { id: 'M18', name: 'Burrata & Pesto Flatbread', category: 'Continental', dietary: 'Veg', spicy: false, prepTime: 15, price: 440, emoji: '🍕', desc: 'Stone-baked crust with creamy burrata and basil pesto.' },
      // Breads & Sides (3)
      { id: 'M19', name: 'Garlic Butter Naan', category: 'Breads & Sides', dietary: 'Veg', spicy: false, prepTime: 10, price: 95, emoji: '🫓', desc: 'Tandoor-baked leavened flatbread brushed with garlic ghee.' },
      { id: 'M20', name: 'Flaky Malabar Parotta', category: 'Breads & Sides', dietary: 'Veg', spicy: false, prepTime: 10, price: 110, emoji: '🥞', desc: 'Multi-layered crisp South Indian griddled flatbread.' },
      { id: 'M21', name: 'Jeera Pulao', category: 'Breads & Sides', dietary: 'Veg', spicy: false, prepTime: 12, price: 210, emoji: '🍚', desc: 'Fragrant long-grain basmati tempered with toasted cumin.' },
      // Desserts & Drinks (4)
      { id: 'M22', name: 'Saffron Rasmalai', category: 'Desserts & Drinks', dietary: 'Veg', spicy: false, prepTime: 10, price: 220, emoji: '🍮', desc: 'Chilled cardamom saffron milk dumplings with pistachios.' },
      { id: 'M23', name: 'Warm Gulab Jamun', category: 'Desserts & Drinks', dietary: 'Veg', spicy: false, prepTime: 10, price: 190, emoji: '🍩', desc: 'Rose-syrup soaked khoya dumplings with vanilla bean ice cream.' },
      { id: 'M24', name: 'Classic Tiramisu', category: 'Desserts & Drinks', dietary: 'Veg', spicy: false, prepTime: 10, price: 310, emoji: '🍰', desc: 'Espresso-soaked ladyfingers layered with mascarpone cream.' },
      { id: 'M25', name: 'Smoked Mango Chili Mocktail', category: 'Desserts & Drinks', dietary: 'Veg', spicy: true, prepTime: 10, price: 180, emoji: '🥭', desc: 'Alphonso mango nectar shaken with lime and bird-eye chili.' },
    ];

    const todayStr = new Date().toISOString().split('T')[0];

    const INITIAL_RESERVATIONS = [
      {
        id: 'SPK-8042',
        guestName: 'Aarav Sharma',
        phone: '+91 98201 44510',
        partySize: 4,
        date: todayStr,
        slotId: '20:00',
        slotLabel: '8:00 PM - 9:30 PM',
        arrivalMins: 20 * 60, // 8:00 PM
        tableId: 'T4',
        items: [
          { ...MENU_SEED.find(m => m.id === 'M07'), qty: 2 }, // Chicken Biryani (20 min prep)
          { ...MENU_SEED.find(m => m.id === 'M19'), qty: 2 },
        ],
        allergyNotes: 'Medium spice on Biryani, no cashews',
        kdsStatus: 'Pending', // Pending | Cooking | Plated
        checkedIn: false,
        courseStage: 'Reserved', // Reserved | Seated | Mains Served | Dessert/Check
        splitCount: 4,
        createdAt: Date.now() - 3600000,
      },
      {
        id: 'SPK-7915',
        guestName: 'Elena Vance',
        phone: '+91 98112 33098',
        partySize: 2,
        date: todayStr,
        slotId: '19:30',
        slotLabel: '7:30 PM - 9:00 PM',
        arrivalMins: 19 * 60 + 30, // 7:30 PM
        tableId: 'T1',
        items: [
          { ...MENU_SEED.find(m => m.id === 'M14'), qty: 1 }, // Salmon 22 min
          { ...MENU_SEED.find(m => m.id === 'M15'), qty: 1 }, // Risotto 20 min
        ],
        allergyNotes: 'Gluten-free bread substitute',
        kdsStatus: 'Cooking',
        checkedIn: true,
        courseStage: 'Seated',
        splitCount: 2,
        createdAt: Date.now() - 5400000,
      },
      {
        id: 'SPK-7701',
        guestName: 'Rohan Mehta',
        phone: '+91 99001 77821',
        partySize: 6,
        date: todayStr,
        slotId: '18:30',
        slotLabel: '6:30 PM - 8:00 PM',
        arrivalMins: 18 * 60 + 30, // 6:30 PM
        tableId: 'T6',
        items: [
          { ...MENU_SEED.find(m => m.id === 'M08'), qty: 2 },
          { ...MENU_SEED.find(m => m.id === 'M09'), qty: 2 },
          { ...MENU_SEED.find(m => m.id === 'M19'), qty: 6 },
        ],
        allergyNotes: 'None',
        kdsStatus: 'Plated',
        checkedIn: true,
        courseStage: 'Mains Served',
        splitCount: 6,
        createdAt: Date.now() - 7200000,
      }
    ];

    // ==================== HELPERS ====================
    const formatMinsToTime = (totalMins) => {
      const h24 = Math.floor(totalMins / 60) % 24;
      const m = totalMins % 60;
      const period = h24 >= 12 ? 'PM' : 'AM';
      const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
      return `${h12}:${m.toString().padStart(2, '0')} ${period}`;
    };

    const calcOrderTotals = (items) => {
      const subtotal = items.reduce((sum, i) => sum + i.price * i.qty, 0);
      const gst = Math.round(subtotal * 0.05);
      const serviceCharge = Math.round(subtotal * 0.10);
      const total = subtotal + gst + serviceCharge;
      return { subtotal, gst, serviceCharge, total };
    };

    const getMaxPrepTime = (items) => {
      if (!items || items.length === 0) return 15;
      return Math.max(...items.map(i => i.prepTime));
    };

    // Deterministic visual QR code SVG
    const QrCodeSvg = ({ value }) => {
      const seed = value.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
      const cells = [];
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const isCorner = (r < 3 && c < 3) || (r < 3 && c > 5) || (r > 5 && c < 3);
          const filled = isCorner || ((seed + r * 7 + c * 13) % 3 !== 0);
          if (filled) {
            cells.push(<rect key={`${r}-${c}`} x={c * 10 + 5} y={r * 10 + 5} width="8" height="8" rx="1.5" fill="#1C1917" />);
          }
        }
      }
      return (
        <svg viewBox="0 0 100 100" className="w-24 h-24 bg-white p-1.5 rounded-lg border border-stone-200">
          {cells}
        </svg>
      );
    };

    // ==================== MAIN APP ====================
    function App() {
      const [activeTab, setActiveTab] = useState('diner'); // diner | tracker | kds | hostess | analytics
      const [reservations, setReservations] = useState(() => {
        try {
          const saved = localStorage.getItem('spicestack_reservations_v1');
          return saved ? JSON.parse(saved) : INITIAL_RESERVATIONS;
        } catch {
          return INITIAL_RESERVATIONS;
        }
      });

      // Simulated Restaurant Clock (default 7:35 PM = 1175 mins so user can easily jump to 7:40 PM)
      const [simClockMins, setSimClockMins] = useState(19 * 60 + 35);

      // Booking State
      const [guestName, setGuestName] = useState('');
      const [phone, setPhone] = useState('');
      const [partySize, setPartySize] = useState(4);
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [selectedSlotId, setSelectedSlotId] = useState('20:00');
      const [selectedTableId, setSelectedTableId] = useState('');
      const [cart, setCart] = useState([]);
      const [allergyNotes, setAllergyNotes] = useState('');
      const [splitEnabled, setSplitEnabled] = useState(false);

      // Menu Filters
      const [menuCategory, setMenuCategory] = useState('All');
      const [dietFilter, setDietFilter] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');

      // SMS Confirmation Modal
      const [smsModal, setSmsModal] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem('spicestack_reservations_v1', JSON.stringify(reservations));
        } catch {}
      }, [reservations]);

      // Atomic 90-Minute Overlap Check
      const isTableLocked = (tableId, date, slotId) => {
        const slot = TIME_SLOTS.find(s => s.id === slotId);
        if (!slot) return false;
        return reservations.some(r => {
          if (r.tableId !== tableId || r.date !== date) return false;
          // Overlap if within 90 minutes of existing booking start
          return Math.abs(r.arrivalMins - slot.startMins) < 90;
        });
      };

      const addToCart = (item) => {
        setCart(prev => {
          const exists = prev.find(i => i.id === item.id);
          if (exists) return prev.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i);
          return [...prev, { ...item, qty: 1 }];
        });
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev
          .map(i => i.id === id ? { ...i, qty: i.qty + delta } : i)
          .filter(i => i.qty > 0)
        );
      };

      const filteredMenu = useMemo(() => {
        return MENU_SEED.filter(item => {
          if (menuCategory !== 'All' && item.category !== menuCategory) return false;
          if (dietFilter === 'Veg' && item.dietary !== 'Veg') return false;
          if (dietFilter === 'Non-Veg' && item.dietary !== 'Non-Veg') return false;
          if (dietFilter === 'Spicy' && !item.spicy) return false;
          if (searchQuery && !item.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          return true;
        });
      }, [menuCategory, dietFilter, searchQuery]);

      const handleConfirmBooking = (e) => {
        e.preventDefault();
        if (!selectedTableId) {
          alert('Please select an available table first.');
          return;
        }
        if (cart.length === 0) {
          alert('Please pre-order at least one dish to synchronize with the kitchen.');
          return;
        }
        if (isTableLocked(selectedTableId, selectedDate, selectedSlotId)) {
          alert('Atomic Lock Triggered: This table was just booked for an overlapping 90-minute window.');
          return;
        }

        const slot = TIME_SLOTS.find(s => s.id === selectedSlotId);
        const newRes = {
          id: 'SPK-' + Math.floor(1000 + Math.random() * 9000),
          guestName: guestName.trim() || 'Guest Diner',
          phone: phone.trim() || '+91 98000 12345',
          partySize,
          date: selectedDate,
          slotId: selectedSlotId,
          slotLabel: slot.label,
          arrivalMins: slot.startMins,
          tableId: selectedTableId,
          items: cart,
          allergyNotes: allergyNotes.trim() || 'None',
          kdsStatus: 'Pending',
          checkedIn: false,
          courseStage: 'Reserved',
          splitCount: partySize,
          createdAt: Date.now(),
        };

        setReservations(prev => [newRes, ...prev]);
        setSmsModal(newRes);
        setCart([]);
        setAllergyNotes('');
        setSelectedTableId('');
      };

      const updateKdsStatus = (resId, newStatus) => {
        setReservations(prev => prev.map(r => r.id === resId ? { ...r, kdsStatus: newStatus } : r));
      };

      const checkInGuest = (resId) => {
        setReservations(prev => prev.map(r => r.id === resId ? { ...r, checkedIn: true, courseStage: 'Seated' } : r));
      };

      const advanceCourse = (resId) => {
        const stages = ['Reserved', 'Seated', 'Mains Served', 'Dessert/Check'];
        setReservations(prev => prev.map(r => {
          if (r.id !== resId) return r;
          const nextIdx = (stages.indexOf(r.courseStage) + 1) % stages.length;
          return { ...r, courseStage: stages[nextIdx], checkedIn: nextIdx > 0 };
        }));
      };

      const resetDemoData = () => {
        setReservations(INITIAL_RESERVATIONS);
        setSimClockMins(19 * 60 + 40); // Jump straight to 7:40 PM!
        setActiveTab('kds');
      };

      const cartTotals = calcOrderTotals(cart);

      // KDS Sorted Queue
      const kdsTickets = useMemo(() => {
        return [...reservations].map(res => {
          const maxPrep = getMaxPrepTime(res.items);
          const targetPrepStart = res.arrivalMins - maxPrep; // Key Heuristic
          const minsUntilArrival = res.arrivalMins - simClockMins;
          const minsUntilFire = targetPrepStart - simClockMins;
          const shouldFireNow = (minsUntilFire <= 0 && res.kdsStatus === 'Pending') || (res.checkedIn && res.kdsStatus === 'Pending');
          return { ...res, maxPrep, targetPrepStart, minsUntilArrival, minsUntilFire, shouldFireNow };
        }).sort((a, b) => {
          // Priority: Checked-in Pending -> Fire Now -> Pending by targetPrepStart -> Cooking -> Plated
          const rank = (t) => {
            if (t.kdsStatus === 'Plated') return 4;
            if (t.checkedIn && t.kdsStatus === 'Pending') return 0;
            if (t.shouldFireNow) return 1;
            if (t.kdsStatus === 'Cooking') return 2;
            return 3;
          };
          if (rank(a) !== rank(b)) return rank(a) - rank(b);
          return a.targetPrepStart - b.targetPrepStart;
        });
      }, [reservations, simClockMins]);

      // Analytics Computations
      const analytics = useMemo(() => {
        const totalTables = TABLES_SEED.length;
        const bookedTableIds = new Set(reservations.map(r => r.tableId));
        const occupancyRate = Math.round((bookedTableIds.size / totalTables) * 100);
        const totalRevenue = reservations.reduce((acc, r) => acc + calcOrderTotals(r.items).total, 0);
        const avgPrep = reservations.length
          ? Math.round(reservations.reduce((acc, r) => acc + getMaxPrepTime(r.items), 0) / reservations.length)
          : 18;
        const preOrderCount = reservations.filter(r => r.items.length > 0).length;
        return { occupancyRate, totalRevenue, avgPrep, preOrderRate: reservations.length ? Math.round((preOrderCount / reservations.length) * 100) : 100 };
      }, [reservations]);

      const getVacancyEstimate = (stage) => {
        if (stage === 'Seated') return '45 min';
        if (stage === 'Mains Served') return '22 min';
        if (stage === 'Dessert/Check') return '8 min';
        return 'Available';
      };

      const isDarkKds = activeTab === 'kds';

      return (
        <div className={`min-h-screen transition-colors ${isDarkKds ? 'bg-[#0B0F19] text-white' : 'bg-[#FAF8F5] text-stone-900'}`}>
          {/* TOP NAVBAR */}
          <header className={`sticky top-0 z-40 border-b ${isDarkKds ? 'bg-[#111827] border-slate-800' : 'bg-white/95 backdrop-blur border-stone-200'}`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-[#C2410C] text-white flex items-center justify-center font-bold text-lg shadow-sm">
                  <i className="fa-solid fa-fire-burner"></i>
                </div>
                <div>
                  <h1 className="font-serif-display text-xl font-bold leading-tight tracking-tight">SpiceStack</h1>
                  <p className={`text-xs font-medium ${isDarkKds ? 'text-slate-400' : 'text-stone-500'}`}>TableTurn Hack • Synced Dining & KDS</p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex flex-wrap items-center gap-1.5">
                {[
                  { id: 'diner', label: 'Reserve & Menu', icon: 'fa-utensils' },
                  { id: 'tracker', label: 'My Pass', icon: 'fa-qrcode' },
                  { id: 'kds', label: 'Kitchen KDS', icon: 'fa-display' },
                  { id: 'hostess', label: 'Hostess Floor', icon: 'fa-chair' },
                  { id: 'analytics', label: 'Analytics', icon: 'fa-chart-line' },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3.5 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition ${
                      activeTab === tab.id
                        ? 'bg-[#C2410C] text-white shadow-sm'
                        : isDarkKds
                          ? 'text-slate-300 hover:bg-slate-800'
                          : 'text-stone-600 hover:bg-stone-100'
                    }`}
                  >
                    <i className={`fa-solid ${tab.icon}`}></i>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>

              {/* Simulated Live Clock Control */}
              <div className={`flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs ${isDarkKds ? 'bg-slate-900 border-slate-700' : 'bg-stone-50 border-stone-200'}`}>
                <i className="fa-regular fa-clock text-[#C2410C]"></i>
                <span className="font-mono-code font-bold text-sm">{formatMinsToTime(simClockMins)}</span>
                <button
                  onClick={() => setSimClockMins(m => m + 5)}
                  className="px-2 py-0.5 rounded bg-stone-200 text-stone-800 hover:bg-stone-300 font-semibold"
                  title="Advance simulated clock by 5 mins"
                >+5m</button>
                <button
                  onClick={resetDemoData}
                  className="px-2 py-0.5 rounded bg-amber-500 text-stone-950 hover:bg-amber-400 font-bold"
                  title="Jump to 7:40 PM Demo Scenario"
                >7:40 PM Demo</button>
              </div>
            </div>
          </header>

          {/* ==================== VIEW 1: DINER RESERVATION & PRE-ORDER ==================== */}
          {activeTab === 'diner' && (
            <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
              <div className="lg:col-span-8 space-y-8">
                {/* Step 1: Table Reservation */}
                <section className="bg-white rounded-2xl p-6 border border-stone-200 shadow-sm">
                  <div className="flex items-center justify-between mb-5">
                    <div>
                      <span className="text-xs font-bold uppercase tracking-wider text-[#C2410C]">Step 1 • Atomic Slot Lock</span>
                      <h2 className="font-serif-display text-2xl font-bold mt-0.5">Reserve Your Table</h2>
                    </div>
                    <span className="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full font-semibold">
                      90-Min Window Protection
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div>
                      <label className="block text-xs font-bold text-stone-500 uppercase mb-1.5">Dining Date</label>
                      <input type="date" value={selectedDate} onChange={e => setSelectedDate(e.target.value)}
                        className="w-full px-3 py-2.5 rounded-xl border border-stone-300 text-sm font-medium focus:outline-none focus:border-[#C2410C]" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-stone-500 uppercase mb-1.5">Party Size</label>
                      <select value={partySize} onChange={e => { setPartySize(Number(e.target.value)); setSelectedTableId(''); }}
                        className="w-full px-3 py-2.5 rounded-xl border border-stone-300 text-sm font-medium focus:outline-none focus:border-[#C2410C]">
                        {[1,2,3,4,5,6].map(n => <option key={n} value={n}>{n} {n === 1 ? 'Guest' : 'Guests'}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-stone-500 uppercase mb-1.5">Time Slot</label>
                      <select value={selectedSlotId} onChange={e => { setSelectedSlotId(e.target.value); setSelectedTableId(''); }}
                        className="w-full px-3 py-2.5 rounded-xl border border-stone-300 text-sm font-medium focus:outline-none focus:border-[#C2410C]">
                        {TIME_SLOTS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                      </select>
                    </div>
                  </div>

                  {/* Table Selector Grid */}
                  <p className="text-xs font-bold text-stone-500 uppercase mb-2.5">Select Available Table</p>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    {TABLES_SEED.map(tbl => {
                      const locked = isTableLocked(tbl.id, selectedDate, selectedSlotId);
                      const tooSmall = tbl.capacity < partySize;
                      const disabled = locked || tooSmall;
                      const active = selectedTableId === tbl.id;
                      return (
                        <button
                          key={tbl.id}
                          type="button"
                          disabled={disabled}
                          onClick={() => setSelectedTableId(tbl.id)}
                          className={`p-3.5 rounded-xl border text-left transition ${
                            active
                              ? 'border-[#C2410C] bg-orange-50 ring-2 ring-[#C2410C]/20'
                              : disabled
                                ? 'border-stone-200 bg-stone-100 opacity-55 cursor-not-allowed'
                                : 'border-stone-200 hover:border-stone-400 bg-white'
                          }`}
                        >
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-sm">{tbl.name}</span>
                            <span className="text-xs font-semibold text-stone-500">{tbl.capacity}-top</span>
                          </div>
                          <p className="text-xs text-stone-500 mt-1">{tbl.zone}</p>
                          <p className={`text-[11px] font-bold mt-2 ${locked ? 'text-red-600' : tooSmall ? 'text-stone-400' : 'text-emerald-700'}`}>
                            {locked ? 'Booked (Locked)' : tooSmall ? 'Too small' : 'Available'}
                          </p>
                        </button>
                      );
                    })}
                  </div>
                </section>

                {/* Step 2: Interactive Digital Menu */}
                <section className="bg-white rounded-2xl p-6 border border-stone-200 shadow-sm">
                  <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
                    <div>
                      <span className="text-xs font-bold uppercase tracking-wider text-[#C2410C]">Step 2 • Zero-Wait Pre-Order</span>
                      <h2 className="font-serif-display text-2xl font-bold mt-0.5">Interactive Digital Menu (25 Dishes)</h2>
                    </div>
                    <input
                      type="text"
                      placeholder="Search biryani, butter chicken..."
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      className="px-3.5 py-2 rounded-xl border border-stone-300 text-sm w-60 focus:outline-none focus:border-[#C2410C]"
                    />
                  </div>

                  {/* Category & Dietary Filters */}
                  <div className="flex flex-wrap items-center justify-between gap-3 mb-5 pb-4 border-b border-stone-100">
                    <div className="flex flex-wrap gap-1.5">
                      {['All', 'Starters', 'Indian Mains', 'Continental', 'Breads & Sides', 'Desserts & Drinks'].map(cat => (
                        <button
                          key={cat}
                          onClick={() => setMenuCategory(cat)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                            menuCategory === cat ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                          }`}
                        >{cat}</button>
                      ))}
                    </div>
                    <div className="flex gap-1.5">
                      {['All', 'Veg', 'Non-Veg', 'Spicy'].map(d => (
                        <button
                          key={d}
                          onClick={() => setDietFilter(d)}
                          className={`px-2.5 py-1 rounded-lg text-xs font-semibold border transition ${
                            dietFilter === d ? 'border-[#C2410C] bg-orange-50 text-[#C2410C]' : 'border-stone-200 text-stone-600'
                          }`}
                        >{d}</button>
                      ))}
                    </div>
                  </div>

                  {/* Dish Grid */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {filteredMenu.map(item => {
                      const inCart = cart.find(c => c.id === item.id);
                      return (
                        <div key={item.id} className="p-4 rounded-xl border border-stone-200 hover:border-stone-300 transition flex justify-between gap-3 bg-[#FAF8F5]/50">
                          <div className="flex-1">
                            <div className="flex items-center gap-2 mb-1">
                              <span className="text-xl">{item.emoji}</span>
                              <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${item.dietary === 'Veg' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                                {item.dietary}
                              </span>
                              {item.spicy && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-800">Spicy</span>}
                              <span className="text-[11px] font-mono-code text-stone-500 ml-auto">{item.prepTime}m prep</span>
                            </div>
                            <h3 className="font-bold text-stone-900 text-sm">{item.name}</h3>
                            <p className="text-xs text-stone-500 mt-0.5 line-clamp-2">{item.desc}</p>
                            <div className="flex items-center justify-between mt-3">
                              <span className="font-bold text-stone-900">₹{item.price}</span>
                              {inCart ? (
                                <div className="flex items-center gap-2 bg-stone-900 text-white rounded-lg px-2 py-1 text-xs font-bold">
                                  <button onClick={() => updateCartQty(item.id, -1)} className="px-1">-</button>
                                  <span>{inCart.qty}</span>
                                  <button onClick={() => updateCartQty(item.id, 1)} className="px-1">+</button>
                                </div>
                              ) : (
                                <button
                                  onClick={() => addToCart(item)}
                                  className="px-3 py-1 rounded-lg bg-white border border-stone-300 hover:border-[#C2410C] hover:text-[#C2410C] text-xs font-bold transition"
                                >+ Add</button>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>
              </div>

              {/* RIGHT SIDEBAR: LIVE BILL PREVIEW & CHECKOUT */}
              <aside className="lg:col-span-4">
                <form onSubmit={handleConfirmBooking} className="bg-white rounded-2xl p-6 border border-stone-200 shadow-sm sticky top-24 space-y-5">
                  <div className="border-b border-stone-100 pb-3">
                    <h3 className="font-serif-display text-xl font-bold">Booking & Pre-Order Summary</h3>
                    <p className="text-xs text-stone-500 mt-0.5">
                      {selectedTableId ? `${TABLES_SEED.find(t => t.id === selectedTableId)?.name} • ` : 'No table selected • '}
                      {TIME_SLOTS.find(s => s.id === selectedSlotId)?.label}
                    </p>
                  </div>

                  {/* Guest Info */}
                  <div className="space-y-3">
                    <input type="text" required placeholder="Your Full Name" value={guestName} onChange={e => setGuestName(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-[#C2410C]" />
                    <input type="tel" required placeholder="Mobile Number (for SMS Pass)" value={phone} onChange={e => setPhone(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-[#C2410C]" />
                  </div>

                  {/* Cart Items */}
                  <div className="max-h-52 overflow-y-auto space-y-2.5 pr-1">
                    {cart.length === 0 ? (
                      <div className="text-center py-6 bg-stone-50 rounded-xl border border-dashed border-stone-300 text-xs text-stone-500">
                        Add dishes from the menu to pre-order for your arrival.
                      </div>
                    ) : cart.map(item => (
                      <div key={item.id} className="flex items-center justify-between text-sm">
                        <div>
                          <p className="font-semibold text-stone-800">{item.name}</p>
                          <p className="text-xs text-stone-500">₹{item.price} × {item.qty} • {item.prepTime}m prep</p>
                        </div>
                        <span className="font-bold">₹{item.price * item.qty}</span>
                      </div>
                    ))}
                  </div>

                  {/* Allergy & Customization Notes (Stretch) */}
                  <div>
                    <label className="block text-xs font-bold text-stone-500 uppercase mb-1">Allergy & Kitchen Notes</label>
                    <input type="text" placeholder="e.g., Nut allergy, extra spicy, gluten-free" value={allergyNotes} onChange={e => setAllergyNotes(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-stone-300 text-xs focus:outline-none focus:border-[#C2410C]" />
                  </div>

                  {/* Automated Order Total & Split Bill Calculator */}
                  <div className="bg-[#FAF8F5] rounded-xl p-4 space-y-2 text-sm border border-stone-200">
                    <div className="flex justify-between text-stone-600">
                      <span>Subtotal</span>
                      <span>₹{cartTotals.subtotal}</span>
                    </div>
                    <div className="flex justify-between text-stone-600">
                      <span>GST (5%)</span>
                      <span>₹{cartTotals.gst}</span>
                    </div>
                    <div className="flex justify-between text-stone-600">
                      <span>Service Charge (10%)</span>
                      <span>₹{cartTotals.serviceCharge}</span>
                    </div>
                    <div className="flex justify-between font-bold text-base pt-2 border-t border-stone-200">
                      <span>Total Bill</span>
                      <span className="text-[#C2410C]">₹{cartTotals.total}</span>
                    </div>

                    {/* Split Bill Toggle */}
                    <div className="pt-2 border-t border-stone-200">
                      <label className="flex items-center justify-between cursor-pointer text-xs font-semibold text-stone-700">
                        <span>Split Bill Equally ({partySize} guests)</span>
                        <input type="checkbox" checked={splitEnabled} onChange={e => setSplitEnabled(e.target.checked)} className="accent-[#C2410C]" />
                      </label>
                      {splitEnabled && cartTotals.total > 0 && (
                        <p className="text-xs font-bold text-emerald-700 mt-1.5">
                          ₹{Math.ceil(cartTotals.total / partySize)} per guest
                        </p>
                      )}
                    </div>
                  </div>

                  {/* Firing Sync Preview */}
                  {cart.length > 0 && (
                    <div className="text-xs bg-amber-50 border border-amber-200 text-amber-900 rounded-xl p-3 flex items-start gap-2">
                      <i className="fa-solid fa-bolt text-amber-600 mt-0.5"></i>
                      <span>
                        Max prep time is <b>{getMaxPrepTime(cart)} mins</b>. Kitchen KDS will automatically fire your order at{' '}
                        <b className="font-mono-code">
                          {formatMinsToTime((TIME_SLOTS.find(s => s.id === selectedSlotId)?.startMins || 1200) - getMaxPrepTime(cart))}
                        </b>.
                      </span>
                    </div>
                  )}

                  <button
                    type="submit"
                    className="w-full py-3.5 rounded-xl bg-[#C2410C] hover:bg-[#9A3412] text-white font-bold text-sm shadow-sm transition"
                  >
                    Confirm Table & Sync Kitchen
                  </button>
                </form>
              </aside>
            </main>
          )}

          {/* ==================== VIEW 2: MY RESERVATIONS & LIVE TRACKER ==================== */}
          {activeTab === 'tracker' && (
            <main className="max-w-5xl mx-auto px-4 sm:px-6 py-8 space-y-6">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-[#C2410C]">Live Guest Pass</span>
                <h2 className="font-serif-display text-3xl font-bold mt-1">My Reservations & Live Order Tracker</h2>
              </div>

              <div className="space-y-5">
                {reservations.map(res => {
                  const totals = calcOrderTotals(res.items);
                  const maxPrep = getMaxPrepTime(res.items);
                  const fireTime = formatMinsToTime(res.arrivalMins - maxPrep);
                  const statusMessage =
                    res.kdsStatus === 'Cooking' ? 'Food Being Prepared for Your Arrival!' :
                    res.kdsStatus === 'Plated' ? 'Plated & Ready to Serve at Your Table!' :
                    `Scheduled to Fire at ${fireTime}`;

                  return (
                    <div key={res.id} className="bg-white rounded-2xl p-6 border border-stone-200 shadow-sm flex flex-col md:flex-row gap-6 justify-between">
                      <div className="flex-1 space-y-3">
                        <div className="flex flex-wrap items-center gap-2.5">
                          <span className="font-mono-code text-xs font-bold bg-stone-900 text-white px-2.5 py-1 rounded">{res.id}</span>
                          <span className="text-sm font-bold text-stone-800">{res.guestName} ({res.partySize} Guests)</span>
                          <span className="text-xs font-semibold text-stone-500">• {TABLES_SEED.find(t => t.id === res.tableId)?.name} • {res.slotLabel}</span>
                        </div>

                        {/* Live Status Banner */}
                        <div className={`p-3.5 rounded-xl border flex items-center gap-3 ${
                          res.kdsStatus === 'Cooking' ? 'bg-emerald-50 border-emerald-200 text-emerald-900' :
                          res.kdsStatus === 'Plated' ? 'bg-blue-50 border-blue-200 text-blue-900' :
                          'bg-amber-50 border-amber-200 text-amber-900'
                        }`}>
                          <i className={`fa-solid text-lg ${
                            res.kdsStatus === 'Cooking' ? 'fa-fire text-emerald-600' :
                            res.kdsStatus === 'Plated' ? 'fa-bell-concierge text-blue-600' :
                            'fa-clock text-amber-600'
                          }`}></i>
                          <div>
                            <p className="text-xs font-bold uppercase tracking-wider opacity-75">Live Kitchen Status</p>
                            <p className="font-bold text-sm">{statusMessage}</p>
                          </div>
                        </div>

                        {/* Pre-ordered items */}
                        <div className="text-sm text-stone-700">
                          <p className="text-xs font-bold uppercase text-stone-400 mb-1">Pre-Ordered Dishes</p>
                          <div className="flex flex-wrap gap-2">
                            {res.items.map(i => (
                              <span key={i.id} className="px-2.5 py-1 rounded-lg bg-stone-100 text-xs font-semibold">
                                {i.qty}× {i.name}
                              </span>
                            ))}
                          </div>
                        </div>

                        {res.allergyNotes && res.allergyNotes !== 'None' && (
                          <p className="text-xs text-red-700 font-semibold">
                            <i className="fa-solid fa-triangle-exclamation mr-1"></i> Kitchen Note: {res.allergyNotes}
                          </p>
                        )}
                      </div>

                      {/* Right Pass QR & Bill */}
                      <div className="flex md:flex-col items-center justify-between md:justify-center gap-3 md:border-l border-stone-100 md:pl-6 min-w-[160px]">
                        <QrCodeSvg value={res.id} />
                        <div className="text-center">
                          <p className="text-xs text-stone-500">Total Bill (Incl. GST)</p>
                          <p className="font-bold text-lg text-[#C2410C]">₹{totals.total}</p>
                          <p className="text-[11px] text-stone-500">₹{Math.ceil(totals.total / res.partySize)} / person</p>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>
          )}

          {/* ==================== VIEW 3: HIGH-CONTRAST KITCHEN DISPLAY SCREEN (KDS) ==================== */}
          {activeTab === 'kds' && (
            <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
              <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
                <div>
                  <span className="text-xs font-bold uppercase tracking-widest text-amber-400">Arrival-Synchronized KDS</span>
                  <h2 className="text-3xl font-extrabold tracking-tight mt-0.5">Live Kitchen Order Queue</h2>
                </div>
                <div className="flex flex-wrap items-center gap-3 text-xs font-bold">
                  <span className="px-3 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40">● Yellow: Pending</span>
                  <span className="px-3 py-1.5 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">● Green: Cooking</span>
                  <span className="px-3 py-1.5 rounded-lg bg-blue-500/20 text-blue-300 border border-blue-500/40">● Blue: Plated</span>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                {kdsTickets.map(ticket => {
                  const statusColor =
                    ticket.kdsStatus === 'Pending' ? 'bg-amber-400 text-stone-950' :
                    ticket.kdsStatus === 'Cooking' ? 'bg-emerald-500 text-stone-950' :
                    'bg-blue-500 text-white';

                  return (
                    <div
                      key={ticket.id}
                      className={`rounded-2xl bg-[#111827] border-2 p-5 flex flex-col justify-between transition ${
                        ticket.shouldFireNow
                          ? 'fire-pulse border-amber-400'
                          : ticket.kdsStatus === 'Cooking'
                            ? 'border-emerald-500/70'
                            : ticket.kdsStatus === 'Plated'
                              ? 'border-blue-500/50 opacity-75'
                              : 'border-slate-700'
                      }`}
                    >
                      <div>
                        {/* Fire Alert Banner */}
                        {ticket.shouldFireNow && (
                          <div className="mb-4 px-3 py-2 rounded-xl bg-amber-400 text-stone-950 font-extrabold text-sm flex items-center justify-between">
                            <span>
                              <i className="fa-solid fa-fire mr-1.5"></i>
                              {ticket.checkedIn ? 'PRIORITY: GUEST CHECKED IN!' : `FIRE DISH NOW — Arrives in ${Math.max(0, ticket.minsUntilArrival)}m`}
                            </span>
                          </div>
                        )}

                        {/* 24pt+ High-Contrast Header */}
                        <div className="flex items-start justify-between gap-2 pb-4 border-b border-slate-800">
                          <div>
                            <h3 className="text-3xl font-extrabold tracking-tight text-white">
                              {TABLES_SEED.find(t => t.id === ticket.tableId)?.name}
                            </h3>
                            <p className="text-sm text-slate-400 font-semibold mt-0.5">{ticket.guestName} • {ticket.id}</p>
                          </div>
                          <span className={`px-3 py-1 rounded-lg text-xs font-extrabold uppercase tracking-wider ${statusColor}`}>
                            {ticket.kdsStatus}
                          </span>
                        </div>

                        {/* Timing Telemetry */}
                        <div className="grid grid-cols-3 gap-2 my-4 text-center bg-slate-900/90 rounded-xl p-3 border border-slate-800">
                          <div>
                            <p className="text-[10px] uppercase text-slate-400 font-bold">Arrival</p>
                            <p className="font-mono-code text-sm font-bold text-white">{formatMinsToTime(ticket.arrivalMins)}</p>
                          </div>
                          <div>
                            <p className="text-[10px] uppercase text-slate-400 font-bold">Target Fire</p>
                            <p className="font-mono-code text-sm font-bold text-amber-400">{formatMinsToTime(ticket.targetPrepStart)}</p>
                          </div>
                          <div>
                            <p className="text-[10px] uppercase text-slate-400 font-bold">Max Prep</p>
                            <p className="font-mono-code text-sm font-bold text-emerald-400">{ticket.maxPrep} min</p>
                          </div>
                        </div>

                        {/* Items List */}
                        <ul className="space-y-2 mb-4">
                          {ticket.items.map(item => (
                            <li key={item.id} className="flex items-center justify-between text-base font-bold text-slate-100 bg-slate-800/60 px-3 py-2 rounded-lg">
                              <span>{item.qty}× {item.name}</span>
                              <span className="font-mono-code text-xs text-slate-400">{item.prepTime}m</span>
                            </li>
                          ))}
                        </ul>

                        {/* Allergy Note */}
                        {ticket.allergyNotes && ticket.allergyNotes !== 'None' && (
                          <div className="mb-4 px-3 py-2 rounded-lg bg-red-500/20 border border-red-500/40 text-red-200 text-xs font-bold">
                            <i className="fa-solid fa-triangle-exclamation mr-1.5"></i> NOTE: {ticket.allergyNotes}
                          </div>
                        )}
                      </div>

                      {/* Action Buttons */}
                      <div className="grid grid-cols-2 gap-2.5 pt-3 border-t border-slate-800">
                        <button
                          onClick={() => updateKdsStatus(ticket.id, 'Cooking')}
                          disabled={ticket.kdsStatus === 'Cooking' || ticket.kdsStatus === 'Plated'}
                          className={`py-3 rounded-xl font-extrabold text-sm transition ${
                            ticket.kdsStatus === 'Pending'
                              ? 'bg-emerald-500 hover:bg-emerald-400 text-stone-950'
                              : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                          }`}
                        >
                          <i className="fa-solid fa-fire-flame-curved mr-1.5"></i> Start Cooking
                        </button>
                        <button
                          onClick={() => updateKdsStatus(ticket.id, 'Plated')}
                          disabled={ticket.kdsStatus === 'Plated'}
                          className={`py-3 rounded-xl font-extrabold text-sm transition ${
                            ticket.kdsStatus !== 'Plated'
                              ? 'bg-blue-500 hover:bg-blue-400 text-white'
                              : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                          }`}
                        >
                          <i className="fa-solid fa-check-double mr-1.5"></i> Ready / Plated
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>
          )}

          {/* ==================== VIEW 4: HOSTESS CHECK-IN & TURN ESTIMATOR ==================== */}
          {activeTab === 'hostess' && (
            <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div>
                  <span className="text-xs font-bold uppercase tracking-wider text-[#C2410C]">Floor Management & Early-Arrival Sync</span>
                  <h2 className="font-serif-display text-3xl font-bold mt-1">Hostess Check-In & Table Turn Estimator</h2>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                {TABLES_SEED.map(tbl => {
                  const res = reservations.find(r => r.tableId === tbl.id);
                  return (
                    <div key={tbl.id} className="bg-white rounded-2xl p-5 border border-stone-200 shadow-sm flex flex-col justify-between gap-4">
                      <div>
                        <div className="flex items-center justify-between">
                          <h3 className="font-bold text-lg">{tbl.name}</h3>
                          <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${
                            !res ? 'bg-emerald-100 text-emerald-800' :
                            res.checkedIn ? 'bg-orange-100 text-[#C2410C]' : 'bg-amber-100 text-amber-800'
                          }`}>
                            {!res ? 'Vacant' : res.checkedIn ? 'Occupied' : 'Reserved'}
                          </span>
                        </div>
                        <p className="text-xs text-stone-500 mt-0.5">{tbl.capacity}-top • {tbl.zone}</p>

                        {res ? (
                          <div className="mt-4 pt-3 border-t border-stone-100 space-y-1.5 text-sm">
                            <p className="font-bold text-stone-800">{res.guestName}</p>
                            <p className="text-xs text-stone-500">Slot: {res.slotLabel}</p>
                            <p className="text-xs font-semibold text-stone-700">Course: <span className="text-[#C2410C]">{res.courseStage}</span></p>
                            <p className="text-xs font-semibold text-emerald-700">
                              Est. Vacant: {getVacancyEstimate(res.courseStage)}
                            </p>
                          </div>
                        ) : (
                          <p className="mt-4 pt-3 border-t border-stone-100 text-xs text-stone-400">Ready for walk-ins or online slot booking.</p>
                        )}
                      </div>

                      {res && (
                        <div className="space-y-2">
                          {!res.checkedIn ? (
                            <button
                              onClick={() => checkInGuest(res.id)}
                              className="w-full py-2.5 rounded-xl bg-[#C2410C] hover:bg-[#9A3412] text-white text-xs font-bold transition"
                            >
                              <i className="fa-solid fa-user-check mr-1.5"></i> Guest Arrived — Check In
                            </button>
                          ) : (
                            <button
                              onClick={() => advanceCourse(res.id)}
                              className="w-full py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-bold transition"
                            >
                              <i className="fa-solid fa-forward mr-1.5"></i> Advance Course Stage
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </main>
          )}

          {/* ==================== VIEW 5: TURNAROUND ANALYTICS DASHBOARD ==================== */}
          {activeTab === 'analytics' && (
            <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-8">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-[#C2410C]">Operations Intelligence</span>
                <h2 className="font-serif-display text-3xl font-bold mt-1">Table Turnaround Analytics</h2>
              </div>

              {/* KPI Row */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                {[
                  { label: 'Avg Dining Duration', value: '55 min', sub: 'Down from 85 min (-35%)', color: 'text-emerald-700' },
                  { label: 'Table Occupancy Rate', value: `${analytics.occupancyRate}%`, sub: `${reservations.length} active covers booked`, color: 'text-[#C2410C]' },
                  { label: 'Pre-Order Revenue', value: `₹${analytics.totalRevenue.toLocaleString()}`, sub: `${analytics.preOrderRate}% pre-order adoption`, color: 'text-stone-900' },
                  { label: 'Avg Kitchen Prep Sync', value: `${analytics.avgPrep} min`, sub: 'Zero idle browsing wait', color: 'text-amber-700' },
                ].map((kpi, idx) => (
                  <div key={idx} className="bg-white rounded-2xl p-6 border border-stone-200 shadow-sm">
                    <p className="text-xs font-bold uppercase text-stone-500">{kpi.label}</p>
                    <p className={`text-4xl font-extrabold mt-2 ${kpi.color}`}>{kpi.value}</p>
                    <p className="text-xs text-stone-500 mt-1.5 font-medium">{kpi.sub}</p>
                  </div>
                ))}
              </div>

              {/* Turnaround Comparison Bar Chart */}
              <div className="bg-white rounded-2xl p-6 border border-stone-200 shadow-sm space-y-6">
                <h3 className="font-serif-display text-xl font-bold">Dining Cycle Breakdown: Traditional vs. SpiceStack</h3>
                <div className="space-y-5">
                  <div>
                    <div className="flex justify-between text-sm font-bold mb-1.5">
                      <span>Traditional Walk-In Dining</span>
                      <span className="text-stone-500">85 mins total</span>
                    </div>
                    <div className="w-full h-9 rounded-xl overflow-hidden flex text-xs font-bold text-white">
                      <div className="bg-stone-400 flex items-center justify-center" style={{ width: '24%' }}>Menu Wait (20m)</div>
                      <div className="bg-amber-600 flex items-center justify-center" style={{ width: '29%' }}>Kitchen Prep (25m)</div>
                      <div className="bg-stone-800 flex items-center justify-center" style={{ width: '47%' }}>Dining & Check (40m)</div>
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between text-sm font-bold mb-1.5">
                      <span className="text-[#C2410C]">SpiceStack Pre-Order Sync</span>
                      <span className="text-emerald-700">55 mins total (+1.5x Covers/Night)</span>
                    </div>
                    <div className="w-full h-9 rounded-xl overflow-hidden flex text-xs font-bold text-white bg-stone-100">
                      <div className="bg-emerald-600 flex items-center justify-center" style={{ width: '6%' }}>5m</div>
                      <div className="bg-[#C2410C] flex items-center justify-center" style={{ width: '12%' }}>Plate (10m)</div>
                      <div className="bg-stone-800 flex items-center justify-center" style={{ width: '47%' }}>Dining & Check (40m)</div>
                    </div>
                  </div>
                </div>
              </div>
            </main>
          )}

          {/* ==================== SMS CONFIRMATION SIMULATOR MODAL ==================== */}
          {smsModal && (
            <div className="fixed inset-0 z-50 bg-stone-950/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-stone-200 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold uppercase tracking-wider text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full">
                    <i className="fa-solid fa-comment-sms mr-1"></i> Simulated SMS Sent
                  </span>
                  <button onClick={() => setSmsModal(null)} className="text-stone-400 hover:text-stone-700">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="bg-stone-100 rounded-xl p-4 text-sm text-stone-800 space-y-1.5 font-medium">
                  <p className="text-xs text-stone-500">To: {smsModal.phone}</p>
                  <p>
                    <b>SpiceStack Confirmed!</b> Hi {smsModal.guestName}, your {TABLES_SEED.find(t => t.id === smsModal.tableId)?.name} is locked for{' '}
                    <b>{smsModal.slotLabel}</b> (ID: {smsModal.id}). Your meal will automatically fire in our kitchen before arrival.
                  </p>
                </div>

                <div className="flex gap-2.5">
                  <a
                    href={`https://calendar.google.com/calendar/render?action=TEMPLATE&text=SpiceStack+Dinner+(${smsModal.id})&details=Table+${smsModal.tableId}+Pre-Order+Confirmed`}
                    target="_blank"
                    rel="noreferrer"
                    className="flex-1 py-2.5 rounded-xl border border-stone-300 text-center text-xs font-bold hover:bg-stone-50"
                  >
                    <i className="fa-regular fa-calendar-plus mr-1"></i> Add to Google Calendar
                  </a>
                  <button
                    onClick={() => { setSmsModal(null); setActiveTab('tracker'); }}
                    className="flex-1 py-2.5 rounded-xl bg-[#C2410C] text-white text-xs font-bold hover:bg-[#9A3412]"
                  >
                    View Live Pass
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
